name: Generate and Publish Short Video

on:
  schedule:
    # S'executa cada 4 hores exactes
    - cron: '0 */4 * * *'
  # Permet executar-lo manualment des del panell de GitHub quan vulguis fer proves
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codi del repositori
        uses: actions/checkout@v4

      - name: Configurar entorn Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instal·lar ImageMagick i FFmpeg (necessaris per a MoviePy)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instal·lar dependències de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar el bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python main.py
