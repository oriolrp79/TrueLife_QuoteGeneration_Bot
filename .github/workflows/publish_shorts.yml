name: Video Generator Bot

on:
  schedule:
    # S'executa automàticament cada 4 hores
    - cron: '0 */4 * * *'
  # Permet prémer un botó per provar-lo manualment
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar codi
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instal·lar FFmpeg i Fonts a Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instal·lar llibreries
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar vídeo amb Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python video_generator.py

      - name: Desar el vídeo generat com a descàrrega
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: sample_short.mp4
          retention-days: 2
